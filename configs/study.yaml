# The study design (PREREGISTRATION.md §5). Every number the pipeline uses comes from here,
# so the preregistration and the code cannot drift apart silently.

languages:
  # code: FineWeb-2 subset (ISO 639-3 + script). flores: FLORES-200 code (FLORES+ calls zho_Hans cmn_Hans). bytes_per_char: UTF-8
  # width of the script's letters, for reading tables only (never used to normalize).
  eus_Latn: {name: Basque, flores: eus_Latn, script: Latin, bytes_per_char: 1, morphology: agglutinative}
  rus_Cyrl: {name: Russian, flores: rus_Cyrl, script: Cyrillic, bytes_per_char: 2, morphology: fusional}
  arb_Arab: {name: Arabic (MSA), flores: arb_Arab, script: Arabic, bytes_per_char: 2, morphology: templatic}
  cmn_Hani: {name: Chinese (Mandarin, Simplified), flores: zho_Hans, script: Han, bytes_per_char: 3, morphology: isolating}
  tam_Taml: {name: Tamil, flores: tam_Taml, script: Tamil, bytes_per_char: 3, morphology: agglutinative}
fallback_languages:
  eus_Latn: ind_Latn # if FineWeb-2 Basque is under 3x its content budget

content:
  # Per-language training content = byte premium (vs. English) x this many English bytes.
  english_equivalent_bytes: 600_000_000
  heldout_english_equivalent_bytes: 2_000_000
  tokenizer_sample_bytes: 200_000_000 # raw bytes, disjoint from the training content
  availability_factor: 3 # FineWeb-2 must hold at least this multiple of the content budget
  sample_seed: 0

tokenizer:
  vocab_size: 16384 # 256 bytes + 16,127 merges + one separator; identical at every level
  levels: [1.0, 1.5, 2.25] # r = tokens/byte relative to the language's full tokenizer
  tolerance: 0.03 # preregistered; the search aims much tighter (see recount.tok.dose)
  swap_level: 1.5 # negative control 1: second tokenizer, disjoint sample, same r
  swap_tolerance: 0.02
  swap_language: rus_Cyrl

models:
  # english_equivalent_fraction scales `content` per model: S reads a third of M's text.
  M: {n_layer: 6, d_model: 384, n_head: 6, english_equivalent_fraction: 1.0}
  S: {n_layer: 4, d_model: 256, n_head: 4, english_equivalent_fraction: 0.3333333333}

training:
  base_seq_len: 512 # level r trains on round(512 * r) tokens: byte-matched windows
  windows_per_step: 64
  optimizer: adamw
  lr: 2.0e-3 # set by the scout's LR check (1e-3 / 2e-3 / 4e-3); amendment if per-level
  beta1: 0.9
  beta2: 0.95
  weight_decay: 0.1
  grad_clip: 1.0
  warmup_frac: 0.02
  decay_frac: 0.2 # WSD: linear cooldown to zero over the final 20% of every endpoint
  dtype: bf16
  pos_type: rope
  mask_unreachable: true # decision 6: rows a level cannot produce are excluded from the softmax

endpoints:
  data_curve_fractions: [0.125, 0.25, 0.5] # cooldown branches of the level-1.0 run
  # Decision 4: cooldown branches of the reference that read exactly the bytes each level's
  # as-deployed branch reads: the matched test of the accounting identity (H3).
  identity_branches: true

evaluation:
  context_stride_frac: 0.5 # sliding windows: score the last half of each window
  robustness_stride_frac: 0.25 # negative control 2 compares against this stride
  shuffle_seed: 1234 # positive control 2: donor contexts drawn from other documents

seeds: [0, 1, 2]

analysis:
  sesoi_text_fraction: 0.10 # an effect smaller than losing 10% of the training text is negligible
  falsification_share: 0.5 # H1 is false if the 95% CI for S lies entirely below this
  bootstrap_draws: 10000
  bootstrap_seed: 0

# Numeric predictions, as [low, high], mirrored from PREREGISTRATION.md §2 so the analysis
# reports which held. Committed with the preregistration on 2026-10-29.
predictions:
  share_2.25: [0.25, 0.80] # H1: S at r = 2.25, model M (point prediction 0.50)
  D_tt_2.25: [0.04, 0.20] # H2: as-deployed penalty (BPB)
  D_bb_2.25: [0.01, 0.10] # H2: content-matched residual (BPB)
  identity_ratio_2.25: [0.70, 1.30] # H3: budget channel / its matched prediction

# The scout (pilot): measures the learning rate, seed noise, and the controls at 20% of the
# content, before the main grid is frozen. It trains no deployed branches.
scout:
  content_scale: 0.2
  lr_language: tam_Taml # the hardest case
  lrs: [1.0e-3, 2.0e-3, 4.0e-3]
  variance_languages: [eus_Latn, tam_Taml]
  seeds: [0, 1, 2]
  swap_seeds: [0, 1]
